# Configuration for crate-ci/typos
# https://github.com/crate-ci/typos
[files]
extend-exclude = [
  "package-lock.json",
  "dist/",
  "node_modules/",
  ".husky/_/",
  "*.snap",
]

[default]
extend-ignore-re = [
  # Hex strings (likely ObjectId examples, hashes)
  "[0-9a-fA-F]{24,}",
  # ObjectId literal references
  "ObjectId",
  # GUIDs
  "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
]

[default.extend-words]
# Substrings inside auto-generated CHANGELOG commit-SHA URLs that
# typos word-tokenizes before the hex regex can mask the full SHA.
ba = "ba"
ede = "ede"
# Locked in by release-please CHANGELOG history (older commit subject
# referenced this misspelling; we cannot rewrite the history line).
unparseable = "unparseable"
# Project-local terms
loopback = "loopback"
